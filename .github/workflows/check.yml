name: Profile Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify profile README structure
        run: |
          test -s README.md
          grep -q "pii-screenshot-guard" README.md
          grep -q "queue-health-watchdog" README.md
          grep -q "OtimizaPC" README.md
          grep -q "Thunderbird-Outlook" README.md
          grep -q "mermaid" README.md
          grep -q "Topology Map" README.md
          grep -q "Sales Retransmission" README.md
          grep -q "Warehouse Picking" README.md
          grep -q "Resumo em Português" README.md
