<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Gabriel Souza (@gavicoding)</title>
  <desc id="d">IT Automation, DevOps and Software Engineer. DPO (LGPD/GDPR). Python, TypeScript, C#, SQL Server.</desc>
  <defs>
    <radialGradient id="glow" cx="30%" cy="40%" r="70%">
      <stop offset="0" stop-color="#1b1b2e"/>
      <stop offset="1" stop-color="#09090b"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="typing"><rect class="type" x="64" y="168" width="0" height="44"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .role { opacity: 0; animation: role 16s infinite; }
      .r2 { animation-delay: 4s; } .r3 { animation-delay: 8s; } .r4 { animation-delay: 12s; }
      @keyframes role { 0% { opacity: 1; } 24% { opacity: 1; } 25% { opacity: 0; } 100% { opacity: 0; } }
      .type { animation: type 4s steps(34) infinite; }
      @keyframes type { 0% { width: 0; } 45% { width: 620px; } 90% { width: 620px; } 100% { width: 0; } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .cell { fill: #16161c; stroke: #2a2a33; animation: cell 6s infinite; }
      .gap { animation-name: gap; }
      @keyframes cell { 0%, 8% { fill: #16161c; stroke: #2a2a33; } 14%, 92% { fill: #0f2a1f; stroke: #14532d; } 100% { fill: #16161c; stroke: #2a2a33; } }
      @keyframes gap { 0%, 8% { fill: #16161c; stroke: #2a2a33; } 14%, 30% { fill: #3a1520; stroke: #fb7185; } 38%, 92% { fill: #0f3a2a; stroke: #34d399; } 100% { fill: #16161c; stroke: #2a2a33; } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) {
        .role, .type, .caret, .cell, .pulse { animation: none; }
        .r1 { opacity: 1; } .type { width: 620px; }
        .cell { fill: #0f2a1f; stroke: #14532d; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#27272f"/>

  <!-- marca -->
  <g transform="translate(64 52)">
    <rect width="44" height="44" rx="10" fill="#1e1b4b" stroke="#6366f1"/>
    <text x="22" y="29" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#a5b4fc">&lt;/&gt;</text>
    <text x="60" y="29" class="mono" font-size="17" fill="#a1a1aa">gavicoding@prod:~$ <tspan fill="#e4e4e7">whoami</tspan></text>
  </g>

  <text x="64" y="150" class="sans" font-size="54" font-weight="700" fill="#fafafa">Gabriel Souza</text>

  <!-- cargos digitados em sequencia -->
  <g clip-path="url(#typing)" class="mono" font-size="25" fill="#818cf8">
    <text class="role r1" x="64" y="198">&gt; IT Automation &amp; Software Engineer</text>
    <text class="role r2" x="64" y="198">&gt; DevOps &amp; Hybrid Windows/Linux Ops</text>
    <text class="role r3" x="64" y="198">&gt; DPO · LGPD / GDPR · OWASP AppSec</text>
    <text class="role r4" x="64" y="198">&gt; Solutions Product Owner (PO)</text>
  </g>

  <text x="64" y="248" class="mono" font-size="15.5" fill="#71717a">Python · TypeScript · Next.js · T-SQL · C# (.NET) · Docker · Windows Server &amp; AD</text>

  <!-- grade de conciliacao (lado direito) -->
  <g transform="translate(828 58)">
    <text x="0" y="0" class="mono" font-size="14" fill="#71717a">daily reconciliation · fictional data</text>
    <g transform="translate(0 16)">
      <rect class="cell" x="0" y="0" width="34" height="34" rx="7" style="animation-delay:0.00s"/>
      <rect class="cell" x="42" y="0" width="34" height="34" rx="7" style="animation-delay:0.12s"/>
      <rect class="cell gap" x="84" y="0" width="34" height="34" rx="7" style="animation-delay:0.24s"/>
      <rect class="cell" x="126" y="0" width="34" height="34" rx="7" style="animation-delay:0.36s"/>
      <rect class="cell" x="168" y="0" width="34" height="34" rx="7" style="animation-delay:0.48s"/>
      <rect class="cell" x="210" y="0" width="34" height="34" rx="7" style="animation-delay:0.60s"/>
      <rect class="cell" x="252" y="0" width="34" height="34" rx="7" style="animation-delay:0.72s"/>
      <rect class="cell" x="294" y="0" width="34" height="34" rx="7" style="animation-delay:0.84s"/>
      <rect class="cell" x="0" y="42" width="34" height="34" rx="7" style="animation-delay:0.96s"/>
      <rect class="cell" x="42" y="42" width="34" height="34" rx="7" style="animation-delay:1.08s"/>
      <rect class="cell" x="84" y="42" width="34" height="34" rx="7" style="animation-delay:1.20s"/>
      <rect class="cell" x="126" y="42" width="34" height="34" rx="7" style="animation-delay:1.32s"/>
      <rect class="cell gap" x="168" y="42" width="34" height="34" rx="7" style="animation-delay:1.44s"/>
      <rect class="cell" x="210" y="42" width="34" height="34" rx="7" style="animation-delay:1.56s"/>
      <rect class="cell" x="252" y="42" width="34" height="34" rx="7" style="animation-delay:1.68s"/>
      <rect class="cell" x="294" y="42" width="34" height="34" rx="7" style="animation-delay:1.80s"/>
      <rect class="cell" x="0" y="84" width="34" height="34" rx="7" style="animation-delay:1.92s"/>
      <rect class="cell gap" x="42" y="84" width="34" height="34" rx="7" style="animation-delay:2.04s"/>
      <rect class="cell" x="84" y="84" width="34" height="34" rx="7" style="animation-delay:2.16s"/>
      <rect class="cell" x="126" y="84" width="34" height="34" rx="7" style="animation-delay:2.28s"/>
      <rect class="cell" x="168" y="84" width="34" height="34" rx="7" style="animation-delay:2.40s"/>
      <rect class="cell" x="210" y="84" width="34" height="34" rx="7" style="animation-delay:2.52s"/>
      <rect class="cell gap" x="252" y="84" width="34" height="34" rx="7" style="animation-delay:2.64s"/>
      <rect class="cell" x="294" y="84" width="34" height="34" rx="7" style="animation-delay:2.76s"/>
    </g>
    <g transform="translate(0 168)">
      <circle class="pulse" cx="6" cy="-5" r="5" fill="#34d399"/>
      <text x="20" y="0" class="mono" font-size="15" fill="#a1a1aa">in sync · gaps fetched by key</text>
    </g>
  </g>
</svg>
